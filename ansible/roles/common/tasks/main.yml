---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - htop
      - unzip
      - ca-certificates
      - gnupg
    state: present

- name: Ensure timezone is Israel
  community.general.timezone:
    name: Asia/Jerusalem

- name: Ensure vm.overcommit_memory is enabled
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    sysctl_set: true
    reload: true
