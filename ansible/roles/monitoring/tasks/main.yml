---
- name: Ensure homelab directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: devops
    group: devops
    mode: "0755"
  loop:
    - "{{ homelab_dir }}"
    - "{{ homelab_dir }}/monitoring"
    - "{{ homelab_dir }}/monitoring/prometheus"
    - "{{ homelab_dir }}/monitoring/loki"
    - "{{ homelab_dir }}/monitoring/alloy"

- name: Deploy Docker Compose file
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ homelab_dir }}/compose.yaml"
    owner: devops
    group: devops
    mode: "0644"

- name: Deploy Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ homelab_dir }}/Dockerfile"
    owner: devops
    group: devops
    mode: "0644"

- name: Deploy web index
  ansible.builtin.copy:
    src: index.html
    dest: "{{ homelab_dir }}/index.html"
    owner: devops
    group: devops
    mode: "0644"
  register: web_index

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ homelab_dir }}/monitoring/prometheus/prometheus.yml"
    owner: devops
    group: devops
    mode: "0644"
  notify: Restart Prometheus

- name: Deploy Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ homelab_dir }}/monitoring/loki/loki-config.yml"
    owner: devops
    group: devops
    mode: "0644"
  notify: Restart Loki

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ homelab_dir }}/monitoring/alloy/config.alloy"
    owner: devops
    group: devops
    mode: "0644"
  notify: Restart Alloy

- name: Ensure external homelab-data volume exists
  community.docker.docker_volume:
    name: homelab-data
    state: present

- name: Seed homelab-data with web content
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      -v homelab-data:/data
      -v {{ homelab_dir }}/index.html:/src/index.html:ro
      alpine
      sh -c 'if [ ! -f /data/index.html ] || ! cmp -s /src/index.html /data/index.html;
      then cp /src/index.html /data/index.html && echo CHANGED;
      else echo OK;
      fi'
  register: seed_web
  changed_when: "'CHANGED' in seed_web.stdout"

- name: Validate Docker Compose configuration
  ansible.builtin.command:
    cmd: docker compose config
    chdir: "{{ homelab_dir }}"
  changed_when: false

- name: Deploy homelab Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_dir }}"
    state: present
    build: policy

- name: Get homelab container status
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ homelab_dir }}"
  register: compose_status
  changed_when: false

- name: Show homelab container status
  ansible.builtin.debug:
    var: compose_status.stdout_lines
