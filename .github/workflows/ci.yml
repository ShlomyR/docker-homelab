name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t homelab-web:test .

      - name: Create external Docker volume
        run: docker volume create homelab-data

      - name: Start services
        run: docker compose up -d

      - name: Show containers
        run: docker compose ps

      - name: Test web service
        run: |
          sleep 10
          curl --fail http://localhost:8080

      - name: Test Redis
        run: docker compose exec -T redis redis-cli ping

      - name: Cleanup
        if: always()
        run: docker compose down

deploy:
    needs: docker-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, homelab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          cd /home/devops/docker-web
          git fetch origin
          git reset --hard origin/main
          docker compose up -d --build

      - name: Wait for services
        run: sleep 15

      - name: Verify deployment
        run: |
          cd /home/devops/docker-web
          docker compose ps
          curl --fail http://localhost:8080
          docker compose exec -T redis redis-cli ping
